<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="presentation" aria-hidden="true">
  <!-- Original ornament for Reconnecting Dunhuang: an eight-petal rosette, drawn as line art. -->
  <g fill="none" stroke="#1F4E79" stroke-width="1" opacity="0.6">
    <circle cx="24" cy="24" r="4"/>
    <g id="petal"><path d="M24 19 C27 14 27 8 24 4 C21 8 21 14 24 19 Z"/></g>
    <use href="#petal" transform="rotate(45 24 24)"/>
    <use href="#petal" transform="rotate(90 24 24)"/>
    <use href="#petal" transform="rotate(135 24 24)"/>
    <use href="#petal" transform="rotate(180 24 24)"/>
    <use href="#petal" transform="rotate(225 24 24)"/>
    <use href="#petal" transform="rotate(270 24 24)"/>
    <use href="#petal" transform="rotate(315 24 24)"/>
    <circle cx="24" cy="24" r="21.5" stroke="#5C534A" opacity="0.6"/>
  </g>
</svg>
